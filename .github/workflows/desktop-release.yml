name: Desktop release

on:
  push:
    tags:
      - 'V*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_DESKTOP_APP_ID: cn.toporeduce.harness

jobs:
  create-version-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version and create tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          current=${latest#v}
          if [[ "$current" =~ ^([0-9]+)\.([0-9]+)$ ]]; then
            major=${BASH_REMATCH[1]}
            minor=${BASH_REMATCH[2]}
            ticks=$((10#$major * 100 + 10#$minor + 1))
          else
            ticks=1
          fi
          next=$(printf 'v%d.%02d' "$((ticks / 100))" "$((ticks % 100))")
          git tag "$next" "$GITHUB_SHA"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  windows:
    if: >-
      always() && needs.create-version-tag.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
    needs: [create-version-tag]
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-version-tag.outputs.tag }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installers
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Normalize Windows artifact names
        shell: pwsh
        run: |
          $root = 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts'
          $setup = Get-ChildItem $root -Filter '*-win-x64.exe' -File | Select-Object -First 1
          if ($null -eq $setup) { throw 'Windows NSIS artifact was not produced' }
          Copy-Item $setup.FullName (Join-Path $root 'windows-x64-setup.exe')
          $msi = Get-ChildItem $root -Filter '*-win-x64.msi' -File | Select-Object -First 1
          if ($null -eq $msi) { throw 'Windows MSI artifact was not produced' }
          Copy-Item $msi.FullName (Join-Path $root 'windows-x64.msi')

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/windows-x64-setup.exe
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/windows-x64.msi
          if-no-files-found: error

  macos:
    if: >-
      always() && needs.create-version-tag.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
    needs: [create-version-tag]
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-version-tag.outputs.tag }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS arm64 installer
        run: pnpm run package:desktop:mac:arm64:unsigned

      - name: Normalize macOS artifact name
        run: |
          root="apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts"
          dmg=$(find "$root" -maxdepth 1 -type f -name '*-mac-arm64.dmg' -print -quit)
          test -n "$dmg"
          cp "$dmg" "$root/macos-arm64.dmg"

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/macos-arm64.dmg
          if-no-files-found: error

  release:
    if: >-
      always() && needs.create-version-tag.result == 'success' &&
      needs.windows.result == 'success'
    needs: [create-version-tag, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: release

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos
          path: release

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag='${{ needs.create-version-tag.outputs.tag }}'
          gh release create "$tag" release/windows-x64-setup.exe release/windows-x64.msi release/macos-arm64.dmg --verify-tag --title "$tag" --notes "Windows x64 EXE、MSI 与 macOS arm64 DMG 安装包。"
