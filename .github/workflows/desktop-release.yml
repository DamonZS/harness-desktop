name: Desktop release

on:
  push:
    branches: [main]
    tags:
      - 'V*'
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to retry, e.g. v0.03 (blank increments the latest published version)'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  DSH_DESKTOP_APP_ID: cn.toporeduce.harness

jobs:
  create-version-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select release version without creating a tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          releases=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.draft == false) | .tag_name')
          latest=$(printf '%s\n' "$releases" | sort -V | tail -n 1)
          current=${latest#v}
          if [[ "$current" =~ ^([0-9]+)\.([0-9]+)$ ]]; then
            major=${BASH_REMATCH[1]}
            minor=${BASH_REMATCH[2]}
            ticks=$((10#$major * 100 + 10#$minor + 1))
          else
            ticks=1
          fi
          next=$(printf 'v%d.%02d' "$((ticks / 100))" "$((ticks % 100))")
          if [[ "$REF_TYPE" == 'tag' ]]; then next="$REF_NAME"; fi
          if [[ -n "$REQUESTED_VERSION" ]]; then next="$REQUESTED_VERSION"; fi
          [[ "$next" =~ ^v[0-9]+\.[0-9]{2}$ ]] || { echo 'Expected version vN.NN'; exit 1; }
          if printf '%s\n' "$releases" | grep -Fxq "$next"; then
            echo "Release $next already exists; published releases are immutable"
            exit 1
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  windows:
    needs: [create-version-tag]
    runs-on: windows-latest
    env:
      DSH_DESKTOP_UNSIGNED_OUTPUT: D:/out
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installers
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Normalize Windows artifact names
        shell: pwsh
        run: |
          $root = $env:DSH_DESKTOP_UNSIGNED_OUTPUT
          $setup = Get-ChildItem $root -Filter '*-win-x64.exe' -File | Select-Object -First 1
          if ($null -eq $setup) { throw 'Windows NSIS artifact was not produced' }
          Copy-Item $setup.FullName (Join-Path $root 'windows-x64-setup.exe')
          $msi = Get-ChildItem $root -Filter '*-win-x64.msi' -File | Select-Object -First 1
          if ($null -eq $msi) { throw 'Windows MSI artifact was not produced' }
          Copy-Item $msi.FullName (Join-Path $root 'windows-x64.msi')

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            D:/out/windows-x64-setup.exe
            D:/out/windows-x64.msi
          if-no-files-found: error

  macos:
    needs: [create-version-tag]
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS arm64 installer
        run: pnpm run package:desktop:mac:arm64:unsigned

      - name: Normalize macOS artifact name
        run: |
          root="apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts"
          dmg=$(find "$root" -maxdepth 1 -type f -name '*-mac-arm64.dmg' -print -quit)
          test -n "$dmg"
          cp "$dmg" "$root/macos-arm64.dmg"

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/macos-arm64.dmg
          if-no-files-found: error

  release:
    needs: [create-version-tag, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check out built source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: release

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos
          path: release

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.create-version-tag.outputs.tag }}
        run: |
          tag="$RELEASE_TAG"
          for asset in windows-x64-setup.exe windows-x64.msi macos-arm64.dmg; do
            test -s "release/$asset"
          done
          releases=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')
          if printf '%s\n' "$releases" | grep -Fxq "$tag"; then
            echo "Release $tag already exists; refusing to replace it"
            exit 1
          fi
          # Failed builds may have left an unpublished tag pointing at broken source.
          old=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
          git push "--force-with-lease=refs/tags/$tag:$old" origin "$GITHUB_SHA:refs/tags/$tag"
          gh release create "$tag" release/windows-x64-setup.exe release/windows-x64.msi release/macos-arm64.dmg --verify-tag --draft --title "$tag" --notes "Windows x64 EXE、MSI（未签名）和 macOS arm64 DMG（临时签名，未经 Apple 公证）。构建提交：$GITHUB_SHA。"
          count=$(gh release view "$tag" --json assets --jq '.assets | length')
          test "$count" -eq 3
          gh release edit "$tag" --draft=false --latest
