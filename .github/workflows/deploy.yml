name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install rsync and SSH client
        run: sudo apt-get update && sudo apt-get install --yes rsync openssh-client

      - name: Check deployment endpoint
        env:
          SERVER_HOST: 106.52.34.109
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          echo "Checking ${SERVER_HOST}:${SERVER_PORT}"
          timeout 20 bash -c "</dev/tcp/${SERVER_HOST}/${SERVER_PORT}" \
            || { echo "Deployment endpoint is unreachable; verify Tencent Cloud security rules and SERVER_HOST/SERVER_PORT secrets."; exit 1; }

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Synchronize source and build outputs
        env:
          SERVER_PATH: /opt/harness-desktop
          SERVER_HOST: 106.52.34.109
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -p ${SERVER_PORT} -o ConnectTimeout=15 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          for attempt in 1 2 3; do
            rsync --archive --delete --exclude='.git' --exclude='node_modules' \
              -e "ssh $SSH_OPTS" ./ "${SERVER_USER}@${SERVER_HOST}:${SERVER_PATH}/" && exit 0
            echo "rsync attempt $attempt failed; retrying"
            sleep 10
          done
          exit 1

      - name: Install production dependencies and restart service
        env:
          SERVER_PATH: /opt/harness-desktop
          SERVICE_NAME: toporeduce.service
          SERVER_HOST: 106.52.34.109
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -p "${SERVER_PORT}" -o ConnectTimeout=15 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "${SERVER_USER}@${SERVER_HOST}" \
            "cd '${SERVER_PATH}' && pnpm install --frozen-lockfile && sudo systemctl restart '${SERVICE_NAME}' && sudo systemctl is-active --quiet '${SERVICE_NAME}'"
